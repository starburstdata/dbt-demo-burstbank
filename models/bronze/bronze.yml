version: 2

models:
  - name: stg_customers
    columns:
      - name: custkey
        tests:
          - not_null
          - unique

  - name: stg_accounts
    columns:
      - name: acctkey
        tests:
          - not_null
          - unique
      - name: custkey
        tests:
          - not_null

  - name: stg_customer_profiles
    columns:
      - name: profilekey
        tests:
          - not_null
      - name: custkey
        tests:
          - not_null

  - name: stg_product_profiles
    columns:
      - name: profilekey
        tests:
          - not_null
      - name: custkey
        tests:
          - not_null

  - name: stg_employees
    columns:
      - name: employee_id
        tests:
          - not_null
          - unique

  - name: stg_credit_card_payments
    columns:
      - name: cc_number
        tests:
          - not_null

  - name: stg_mortgage_payments
    columns:
      - name: mortgage_id
        tests:
          - not_null

  - name: stg_auto_loan_payments
    columns:
      - name: auto_loan_id
        tests:
          - not_null

  - name: stg_state_census
    columns:
      - name: abbreviation
        tests:
          - not_null
          - unique
          # not_null/unique pass on an empty table; this fails if the
          # state-level filter ever drops every row again
          - dbt_utils.at_least_one

  - name: bronze_crm_interactions
    description: Customer service contacts (calls, chats, branch visits, complaints), federated or seeded from the CRM.
    columns:
      - name: interaction_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null

  - name: bronze_crm_digital_activity
    description: Monthly summary of each customer's mobile and web app usage, federated or seeded from the CRM.
    columns:
      - name: customer_id
        tests:
          - not_null
      - name: activity_month
        tests:
          - not_null
