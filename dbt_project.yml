
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'burstbank'
version: '1.0.0'
config-version: 2

profile: 'burstbank'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

require-dbt-version: [">=1.9.0", "<2.0.0"]

vars:
  # 'postgres' = live federated CRM (presenter)
  # 'seed'     = CSV fallback loaded with dbt seed (attendees)
  crm_mode: seed
  crm_catalog: crm
  crm_schema: public
  # Federate vs materialize switch for the optionality moment
  crm_bronze_materialization: view
  # The date the CRM lookback windows are measured from. Pinned rather than
  # current_date so results don't drift with the calendar; must match `today`
  # in scripts/generate_crm_data.py, which the seed data is generated around.
  as_of_date: '2026-09-29'

models:
  burstbank:
    +database: lakehouse
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +materialized: view
      +schema: burstbank_bronze
      +tags: ["bronze"]
    silver:
      +materialized: table
      +schema: burstbank_silver
      +tags: ["silver"]
    gold:
      +materialized: table
      +schema: burstbank_gold
      +tags: ["gold"]

seeds:
  burstbank:
    +schema: burstbank_crm_seed
