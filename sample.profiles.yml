# Copy this file to ~/.dbt/profiles.yml and replace the host placeholder.
# Set GALAXY_HOST as an environment variable before running dbt.
# Note: source data is read from sample.burstbank (read-only).
# dbt writes bronze views to lakehouse.burstbank_bronze and gold tables to
# lakehouse.burstbank_gold. The +schema values in dbt_project.yml are used
# verbatim rather than prefixed with the `schema:` below -- see
# macros/generate_schema_name.sql. The `schema:` below is only the fallback
# for anything without a +schema of its own.
burstbank:
  target: dev
  outputs:
    dev:
      type: trino
      host: "{{ env_var('GALAXY_HOST') }}"
      port: 443
      http_scheme: https
      # Verify Galaxy's TLS certificate. dbt-trino skips the check unless this
      # is set, and `dbt debug` ignores the project-level flag, so set it here.
      cert: true
      database: lakehouse
      schema: burstbank_dbt
      threads: 4

      # --- Authentication options (uncomment one) ---

      # 1. OAuth (browser-based SSO) — recommended for interactive use
      method: oauth

      # 2. Username + password
      # method: ldap
      # user: "{{ env_var('GALAXY_USER') }}"
      # password: "{{ env_var('GALAXY_PASSWORD') }}"
